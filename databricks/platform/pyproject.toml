[project]
name = "magneto-platform"
version = "0.1.0"
description = "Schema-independent Databricks service wiring for Magneto"
requires-python = ">=3.11"
dependencies = ["databricks-sdk==0.151.0", "requests==2.34.2", "mlflow-skinny==3.17.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["magneto_platform*"]
