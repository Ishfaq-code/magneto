# Manual only. References shared assets; never provisions them.
resources:
  jobs:
    research_smoke:
      name: magneto-research-smoke
      max_concurrent_runs: 1
      tasks:
        - task_key: check_services
          environment_key: research
          max_retries: 0
          timeout_seconds: 300
          python_wheel_task:
            package_name: magneto_research
            entry_point: magneto-research-smoke
            parameters:
              - --config
              - ${workspace.file_path}/config/development.example.toml
      environments:
        - environment_key: research
          spec:
            environment_version: '2'
            dependencies:
              - ../dist/*.whl
