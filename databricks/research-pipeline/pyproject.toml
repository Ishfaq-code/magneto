[project]
name = "magneto-research"
version = "0.1.0"
description = "Schema-independent research pipeline scaffolding"
requires-python = ">=3.11"
dependencies = ["databricks-sdk==0.151.0"]

[project.scripts]
magneto-research-smoke = "magneto_research.smoke:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
